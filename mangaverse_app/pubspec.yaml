name: mangaverse_app
description: MangaVerse mobile reader (Clean Architecture + Riverpod) sharing the MangaVerse PHP /api/v1 backend.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  dio: ^5.4.3
  cached_network_image: ^3.3.1
  go_router: ^14.0.0
  path_provider: ^2.1.3
  shared_preferences: ^2.2.3
  shimmer: ^3.0.0
  connectivity_plus: ^6.0.3
  firebase_core: ^3.3.0
  firebase_messaging: ^15.1.0
  flutter_local_notifications: ^17.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
